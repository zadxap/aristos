[package]
name = "aristos"
version = "0.1.0"
description = "Aristos — студенческий дашборд (Yessenov University)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aristos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Бинарник компактнее; lto не включаем — сборка идёт и на слабой машине юзера.
opt-level = "s"
panic = "abort"
strip = true
