# ACL для собственных команд приложения (приложение, не плагин).
# Из capabilities ссылаются на идентификаторы напрямую: allow-write-widget-data и т.д.

[default]
description = "Разрешает собственные команды Aristos"
permissions = [
  "allow-write-widget-data",
  "allow-sync-open",
  "allow-sync-eval",
  "allow-sync-url",
  "allow-sync-diag",
  "allow-sync-close",
  "allow-sync-payload",
  "allow-canvas-session-state",
  "allow-canvas-sync-native",
  "allow-download-update",
  "allow-install-apk",
  "allow-sync-read-log",
  "allow-sync-upload-diag",
]

[[permission]]
identifier = "allow-write-widget-data"
description = "Записывает JSON-снапшот для Android-виджетов в app-каталог"
commands.allow = ["write_widget_data"]

[[permission]]
identifier = "allow-sync-open"
description = "Открывает скрытое/видимое webview-окно синка (нативный Canvas/Платонус синк)"
commands.allow = ["sync_open"]

[[permission]]
identifier = "allow-sync-eval"
description = "Инжектит скрипты синка в harvest-окно"
commands.allow = ["sync_eval"]

[[permission]]
identifier = "allow-sync-url"
description = "Читает текущий URL harvest-окна (детект логина)"
commands.allow = ["sync_url"]

[[permission]]
identifier = "allow-sync-diag"
description = "Диагностика harvest-окна (url + title) для быстрого отказа синка"
commands.allow = ["sync_diag"]

[[permission]]
identifier = "allow-sync-close"
description = "Закрывает harvest-окно"
commands.allow = ["sync_close"]

[[permission]]
identifier = "allow-sync-payload"
description = "Инжект-скрипты на внешних страницах отдают результат синка (для remote-sync capability)"
commands.allow = ["sync_payload"]

[[permission]]
identifier = "allow-canvas-session-state"
description = "Проверка живой сессии Canvas по кукам webview"
commands.allow = ["canvas_session_state"]

[[permission]]
identifier = "allow-canvas-sync-native"
description = "Нативный Canvas-синк: reqwest с куками webview, без IPC"
commands.allow = ["canvas_sync_native"]

[[permission]]
identifier = "allow-download-update"
description = "Скачивает APK обновления в кеш приложения (прямая установка на Android)"
commands.allow = ["download_update"]

[[permission]]
identifier = "allow-install-apk"
description = "Запускает системный установщик APK (UpdaterPlugin, Android)"
commands.allow = ["install_apk"]

[[permission]]
identifier = "allow-sync-read-log"
description = "Читает хвост sync-debug.log для диагностики окна синка в UI"
commands.allow = ["sync_read_log"]

[[permission]]
identifier = "allow-sync-upload-diag"
description = "Выгружает sync-debug.log (URL/события окна) на воркер канала для диагностики белого окна"
commands.allow = ["sync_upload_diag"]
