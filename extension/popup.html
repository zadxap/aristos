<!doctype html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #0f172a;
      background: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #2563eb;
      color: #fff;
    }
    .header img.logo {
      width: 26px; height: 26px;
      border-radius: 7px;
      display: block;
      box-shadow: 0 0 0 1px rgba(255,255,255,.25);
    }
    .header .title { flex: 1; min-width: 0; }
    .header b { font-size: 14px; }
    .lang-toggle { display: flex; gap: 2px; }
    .lang-toggle button {
      padding: 3px 7px;
      border: none; border-radius: 7px;
      font-size: 10px; font-weight: 700;
      background: rgba(255,255,255,.18);
      color: #fff; cursor: pointer;
    }
    .lang-toggle button.active { background: #fff; color: #2563eb; }
    .body { padding: 14px; display: grid; gap: 10px; }
    label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
    .row { display: flex; gap: 6px; }
    input {
      flex: 1; min-width: 0;
      padding: 8px 10px;
      border: 1px solid #cbd5e1; border-radius: 10px;
      font-size: 12px; outline: none;
    }
    input:focus { border-color: #2563eb; }
    button {
      padding: 8px 12px;
      border: none; border-radius: 10px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:disabled { opacity: .55; cursor: default; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover:not(:disabled) { background: #d3dbe6; }
    .btn-primary { background: #2563eb; color: #fff; padding: 10px 12px; font-size: 13px; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-export { background: #fef3c7; color: #92400e; display: none; }
    .btn-export:hover { background: #fde68a; }
    .divider { height: 1px; background: #e2e8f0; margin: 2px 0; }
    .period-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 12px; }
    .status {
      min-height: 32px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e2e8f0;
      font-size: 12px; line-height: 1.45; color: #475569;
      display: flex; align-items: center; gap: 8px;
    }
    .status.ok { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .status.err { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .spinner {
      display: none;
      width: 14px; height: 14px; flex-shrink: 0;
      border: 2px solid #bfdbfe; border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta { font-size: 11px; color: #94a3b8; line-height: 1.5; }
    .meta a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .meta a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <img class="logo" src="icons/icon-48.png" alt="Aristos" />
    <div class="title"><b>Aristos Sync</b><div style="font-size:10px;opacity:.85">canvas.yu.edu.kz → дашборд</div></div>
    <div class="lang-toggle">
      <button data-lang-btn="kk">KK</button>
      <button data-lang-btn="ru">RU</button>
    </div>
  </div>
  <div class="body">
    <div>
      <label for="aristos-url" data-i18n="urlLabel"></label>
      <div class="row" style="margin-top:4px">
        <input id="aristos-url" type="url" placeholder="https://aristoss.vercel.app" spellcheck="false" />
        <button id="save-url" class="btn-secondary" data-i18n-title="saveTitle">OK</button>
      </div>
    </div>
    <button id="sync" class="btn-primary" data-i18n="syncBtn"></button>
    <div class="divider"></div>
    <label style="display:block" data-i18n="platonusLabel"></label>
    <button id="platonus-discover" class="btn-secondary" style="width:100%" data-i18n="platonusDiscover"></button>
    <div id="platonus-periods" style="display:none;max-height:120px;overflow-y:auto;padding:6px 8px;border:1px solid #e2e8f0;border-radius:10px;background:#fff"></div>
    <button id="platonus-import" class="btn-primary" style="display:none" data-i18n="platonusImport"></button>
    <button id="export" class="btn-export" data-i18n="exportBtn"></button>
    <button id="debug-html" class="btn-export" data-i18n="debugHtml" style="display:none"></button>
    <div id="status" class="status"><span id="spinner" class="spinner"></span><span id="status-text" data-i18n="statusReady"></span></div>
    <div class="meta">
      <span data-i18n="lastSyncLabel"></span> <span id="last-sync">—</span> · Платонус: <span id="platonus-last">—</span><br />
      <a id="open-aristos" href="#" target="_blank" data-i18n="openDashboard"></a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
