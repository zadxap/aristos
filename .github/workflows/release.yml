# Сборка релизов Aristos: десктоп (Linux/Windows/macOS) + Android APK.
# Триггеры: теги v* (публикация GitHub Release) и ручной запуск (артефакты).
#
# Подпись APK — стабильная: keystore коммитится в репо при первом запуске
# (src-tauri/keystore/aristos-sign.b64, пароль aristos-sign-2026) и
# переиспользуется — обновления APK ставятся поверх старых без сноса.
# Альтернатива через секреты: ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: ubuntu-24.04
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux deps
        if: matrix.settings.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Updater signing keys (приватный ключ из репо)
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY<<KEYEOF" >> "$GITHUB_ENV"
          base64 -d src-tauri/keystore/aristos-updater.b64 >> "$GITHUB_ENV"
          echo "" >> "$GITHUB_ENV"
          echo "KEYEOF" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=aristos-sign-2026" >> "$GITHUB_ENV"

      - name: Build (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          includeUpdaterArtifacts: true
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Aristos {0}', github.ref_name) || '' }}
          releaseBody: |
            **Windows** — Aristos_x.y.z_x64-setup.exe (NSIS).
            **macOS** — dmg без подписи: при первом запуске правый клик → «Открыть» (или `xattr -cr /Applications/Aristos.app` в терминале).
            **Linux** — .deb / .AppImage.
            **Android APK** — скачивается из job'а `android` (универсальный, aarch64+armv7+x86).
          releaseDraft: false
          prerelease: false

      - name: Upload desktop bundles (для ручных запусков без тега)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.settings.platform }}
          path: ${{ matrix.settings.artifacts }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish updater artifact (Windows → воркер)
        if: matrix.settings.platform == 'windows-latest'
        run: |
          SECRET=$(grep -oP 'APP_UPLOAD_SECRET = "\K[^"]+' sync-worker/wrangler.toml)
          V=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          curl -sf -X PUT -H "X-App-Upload-Secret: $SECRET" --data-binary "@${EXE}" \
            "https://aristos-sync.aristoss.workers.dev/api/app/file/Aristos_${V}_x64-setup.exe" \
            || echo "::warning::Не удалось залить exe в воркер — редеплой с APP_UPLOAD_SECRET?"
          curl -sf -X PUT -H "X-App-Upload-Secret: $SECRET" --data-binary "@${EXE}.sig" \
            "https://aristos-sync.aristoss.workers.dev/api/app/file/Aristos_${V}_x64-setup.exe.sig" \
            || echo "::warning::Не удалось залить sig в воркер."

      - name: Publish updater artifact (macOS → воркер)
        if: matrix.settings.platform == 'macos-latest'
        run: |
          SECRET=$(grep -oP 'APP_UPLOAD_SECRET = "\K[^"]+' sync-worker/wrangler.toml)
          V=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TARZ=$(find src-tauri/target/release/bundle -name "*.app.tar.gz" | head -1)
          [ -n "$TARZ" ] || { echo "::warning::.app.tar.gz не найден — updater-артефакт не собрался?"; exit 0; }
          curl -sf -X PUT -H "X-App-Upload-Secret: $SECRET" --data-binary "@${TARZ}" \
            "https://aristos-sync.aristoss.workers.dev/api/app/file/Aristos_${V}_aarch64.app.tar.gz" \
            || echo "::warning::Не удалось залить app.tar.gz в воркер."
          curl -sf -X PUT -H "X-App-Upload-Secret: $SECRET" --data-binary "@${TARZ}.sig" \
            "https://aristos-sync.aristoss.workers.dev/api/app/file/Aristos_${V}_aarch64.app.tar.gz.sig" \
            || echo "::warning::Не удалось залить sig в воркер."

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK + NDK (предустановлены в образе; добираем недостающее)
        run: |
          # sdkmanager не на PATH — берём новейший из cmdline-tools прямым путём
          SDKMANAGER="$(ls -t "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          [ -n "$SDKMANAGER" ] || { echo "sdkmanager не найден в $ANDROID_HOME"; exit 1; }
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            "$SDKMANAGER" "ndk;27.2.12479018"
            NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Generate Android project
        run: npx tauri android init
        env:
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Apply Aristos overlay (widgets + manifest + icons)
        run: |
          cp -r src-tauri/custom-android/. src-tauri/gen/android/
          # иконки приложения (без этого — дефолтный робот на домашнем экране)
          mkdir -p src-tauri/gen/android/app/src/main/res
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      - id: ks
        name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f src-tauri/keystore/aristos-sign.b64 ]; then
            base64 -d src-tauri/keystore/aristos-sign.b64 > keystore.jks
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
            echo "Подпись из репозитория (стабильная)."
          elif [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > keystore.jks
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
            echo "Подпись из секрета ANDROID_KEYSTORE_B64."
          else
            keytool -genkeypair -v \
              -keystore keystore.jks -alias aristos \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass aristos-sign-2026 -keypass aristos-sign-2026 \
              -dname "CN=Aristos, OU=Personal, O=Aristos, L=Kazakhstan, C=KZ"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
            base64 -w0 keystore.jks > /tmp/ks.b64
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/src-tauri/keystore/aristos-sign.b64" \
              -d "{\"message\":\"ci: persist stable signing keystore\",\"content\":\"$(cat /tmp/ks.b64)\"}" \
              | head -c 200 || true
            echo
            echo "::warning::Сгенерирован новый keystore и закоммичен в src-tauri/keystore/aristos-sign.b64 (пароль: aristos-sign-2026). Скачайте артефакт keystore и сохраните копию в надёжном месте."
          fi

      - name: Build APK (universal)
        run: npx tauri android build --apk
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          TAURI_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'aristos-sign-2026' }}
          TAURI_ANDROID_KEY_ALIAS: aristos
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'aristos-sign-2026' }}

      - name: Save keystore copy
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK to update channel
        run: |
          SECRET=$(grep -oP 'APP_UPLOAD_SECRET = "\K[^"]+' sync-worker/wrangler.toml)
          V=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          curl -sf -X PUT -H "X-App-Upload-Secret: $SECRET" --data-binary "@${APK}" \
            "https://aristos-sync.aristoss.workers.dev/api/app/file/Aristos_${V}.apk" \
            || echo "::warning::Не удалось залить APK в воркер — редеплой с APP_UPLOAD_SECRET?"

      - name: Publish APK to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false

  # Финализация канала обновлений: latest.json (для tauri-plugin-updater)
  # и meta (для мобильного баннера) — после android + всех desktop-сборок.
  publish-updates:
    needs: [android, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assemble latest.json and publish meta
        run: |
          SECRET=$(grep -oP 'APP_UPLOAD_SECRET = "\K[^"]+' sync-worker/wrangler.toml)
          V=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          W="https://aristos-sync.aristoss.workers.dev"
          SIG_WIN=$(curl -sf "$W/api/app/file/Aristos_${V}_x64-setup.exe.sig" || echo "")
          SIG_MAC=$(curl -sf "$W/api/app/file/Aristos_${V}_aarch64.app.tar.gz.sig" || echo "")
          python3 - "$V" "$W" "$SIG_WIN" "$SIG_MAC" <<'PY' > /tmp/latest.json
          import json, sys, datetime
          version, worker, sig_win, sig_mac = sys.argv[1:5]
          platforms = {}
          if sig_win:
              platforms["windows-x86_64"] = {
                  "signature": sig_win,
                  "url": f"{worker}/api/app/file/Aristos_{version}_x64-setup.exe",
              }
          if sig_mac:
              platforms["darwin-aarch64"] = {
                  "signature": sig_mac,
                  "url": f"{worker}/api/app/file/Aristos_{version}_aarch64.app.tar.gz",
              }
          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          json.dump({"version": version, "notes": f"Aristos {version}", "pub_date": now, "platforms": platforms}, sys.stdout)
          PY
          curl -sf -X PUT -H "X-App-Upload-Secret: $SECRET" --data-binary "@/tmp/latest.json" \
            "$W/api/app/file/latest.json" || echo "::warning::latest.json не залит — редеплой воркера с APP_UPLOAD_SECRET?"
          FILES=$(python3 -c "import json;print(json.dumps({'apk': 'Aristos_${V}.apk', 'windows': 'Aristos_${V}_x64-setup.exe', 'macos': 'Aristos_${V}_aarch64.app.tar.gz', 'updater': 'latest.json'}))")
          curl -sf -X PUT -H "X-App-Upload-Secret: $SECRET" -H "Content-Type: application/json" \
            -d "{\"version\": \"$V\", \"notes\": \"Aristos $V\", \"files\": $FILES}" \
            "$W/api/app/meta" || echo "::warning::meta не залита."
          echo "Канал обновлений опубликован: версия $V"
